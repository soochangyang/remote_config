
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;MODE=MySQL
    username: sa
    password: '{cipher}'

h2:
  console:
    enabled: true
    path: /h2-console

order-service:
  url: http://127.0.0.1:50000/order-service/%s/orders

